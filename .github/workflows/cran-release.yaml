# Copied from duckdb/duckdb-r's .github/workflows/cran-release.yaml at 86ac17f6b.
# Publishes the draft GitHub release of a CRAN submission once Posit's package manager serves it.
#
# cran-submission.yaml drafts a release for every submission, and ends its notes with the marker
# `<!-- cran-submission: <package> <version> -->`.
# Every night this workflow runs .github/actions/cran-release/cran-release.sh, which checks each such draft
# against the source index of https://packagemanager.posit.co/cran/latest,
# as `fledge:::release_after_cran_built_binaries()` did in fledge.yaml,
# and publishes the drafts whose version that index lists, as the latest release,
# once they carry the tarball the submission attached after its upload,
# and their tag points at the commit they target.
# A version that is not listed yet leaves the run green; the next night checks again.
# Started by hand, from the Actions tab or with
# `gh workflow run cran-release.yaml --repo r-dbi/RSQLite`, it does the same;
# the input `dry-run` (`-f dry-run=true`) reports what it would publish and changes nothing
# (the release process: the header of cran-submission.yaml).
# The `report` job posts the result to the release's checklist issue,
# the open issue whose body carries `<!-- release-checklist: <package> <version> -->`,
# which stays open from the cut until the release is published;
# once this workflow has published a release, the job closes that release's checklist issue
# (.github/actions/release-report/close-checklist.sh).
# Only an issue opened by an owner, member or collaborator of the repository counts:
# anyone can open an issue that carries the marker.
on:
  schedule:
    - cron: "43 5 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run: check the drafts and P3M, but publish nothing"
        type: boolean
        default: false

name: CRAN release

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    name: "Publish the drafts P3M serves"

    outputs:
      published: ${{ steps.release.outputs.published }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check the drafts against P3M, and publish what it serves
        id: release
        uses: ./.github/actions/cran-release
        with:
          token: ${{ github.token }}
          # Empty on a scheduled run, which publishes.
          dry-run: ${{ inputs.dry-run || 'false' }}

  # Posts the result to the checklist issue, one comment updated in place,
  # and closes the checklist issue of each release this run published.
  report:
    needs: [publish]
    if: always()

    runs-on: ubuntu-26.04
    timeout-minutes: 5

    name: "Report to the checklist issue"

    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: .github/actions

      - name: Post or update the comment
        uses: ./.github/actions/release-report
        with:
          key: cran-release
          title: "CRAN release"
          results: |
            publish=${{ needs.publish.result }}
          details: |
            ${{ inputs.dry-run && 'Dry run: nothing was published.' || 'Drafts whose version P3M serves are published as the latest release; see the summary page.' }}
            ${{ needs.publish.outputs.published && format('Published: {0}', needs.publish.outputs.published) || '' }}
          issue-marker: "<!-- release-checklist: "
          token: ${{ github.token }}

      - name: Close the checklist issue of each published release
        if: needs.publish.outputs.published != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PUBLISHED: ${{ needs.publish.outputs.published }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .github/actions/release-report/close-checklist.sh
        shell: bash
