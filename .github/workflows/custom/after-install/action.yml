name: 'Custom steps to run after R packages are installed'

runs:
  using: "composite"
  steps:
    # Must happen after R is installed...
    - name: Define R CMD check error condition
      # Allow NOTEs on R 4.5 due to SET_TRUELENGTH, SET_GROWABLE_BIT and SETLENGTH from cpp11
      run: |
        if (getRversion() >= "4.5" && getRversion() < "4.6") {
          cat('RCMDCHECK_ERROR_ON="warning"\n', file = Sys.getenv("GITHUB_ENV"), append = TRUE)
        }
      shell: Rscript {0}

    # The Arrow tests with real column sizes of 1 and 2 GiB peak at about 2.5 GB each
    # and release their memory before the next test;
    # with them, the test process peaks at about 3.3 GB, in the ungated blob test of `test-blob.R`.
    # They run only when RSQLITE_TEST_LARGE_ARROW is true.
    # The hosted runners of the jobs that call this action afford that.
    # The R-hub containers of rhub.yaml call no custom action, so the test stays off there.
    # A value set before this step, for instance in a matrix entry's `env`, wins.
    - name: Enable the Arrow test with real column sizes
      run: |
        if [ -z "${RSQLITE_TEST_LARGE_ARROW:-}" ]; then
          echo 'RSQLITE_TEST_LARGE_ARROW=true' | tee -a "$GITHUB_ENV"
        fi
      shell: bash
