# Copied from duckdb/duckdb-r's .github/workflows/release-gate.yaml at 86ac17f6b.
# Derived from igraph/rigraph's .github/workflows/release-gate.yaml at fe3538b925.
#
# Mechanical release checks for a release branch, as discussed in cynkra/cynkratemplate#147.
# They run when started by hand on the release branch, from the Actions tab or with
# `gh workflow run release-gate.yaml --repo r-dbi/RSQLite --ref <branch>`,
# and again after every change to it, so that the result describes the commit that will be submitted,
# not a box ticked a few commits earlier.
#
# The checks are the actions of BristolMyersSquibb/blockr.ci,
# pinned to the commit that the issue links to:
# - `gate` fails on the file-level conditions of devtools' release checks:
#   a three-component version, no dependency pinned to a development version, no Remotes,
#   NEWS.md shipped as itself, no placeholder vignette titles.
# - `docs` checks for `\value` in every help page with a `\usage` section,
#   and for a README.md that matches its README.Rmd.
# - `soft` reports spelling, URLs and the NOTEs of R CMD check --as-cran --run-donttest
#   with the CRAN incoming checks turned on, and never fails on a finding.
#   Its URL check prints nothing to the log when every URL resolves,
#   so the `urls` job below is the one to read for URLs.
# - `urls` runs urlchecker::url_check() on the source tree, prints the result to the log,
#   lists every broken or redirected URL with its file and line, status, and replacement in the job summary,
#   and goes red on any of them, because CRAN asks for a 301 to be replaced by its target.
#   Like `docs`, it only reports: a red `urls` job does not fail the release gate,
#   because a third-party host can be down for a moment.
# Each job writes its findings to the job summary,
# and the `report` job posts the results to the open release pull request.
on:
  workflow_dispatch:

name: release-gate

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    name: "Hard gates"

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Run the hard gates
        uses: BristolMyersSquibb/blockr.ci/.github/actions/release-gate@5ee8e2be16e71e96628c6c5c60c20c03f1b35155

  docs:
    runs-on: ubuntu-26.04
    timeout-minutes: 60

    name: "Documentation"

    # Sixteen help pages of RSQLite, mostly classes and deprecated functions, document no return value,
    # so this job reports without holding up a release.
    continue-on-error: true

    # With continue-on-error, `needs.docs.result` reads `success` even when the job failed,
    # so the job hands its own status to the report.
    outputs:
      result: ${{ steps.result.outputs.result }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # devtools::build_readme() installs the package.
      - name: Run the repository-specific before-install steps
        uses: ./.github/workflows/custom/before-install
        if: hashFiles('.github/workflows/custom/before-install/action.yml') != ''

      - name: Install R and the package dependencies
        uses: cynkra/cynkratemplate/.github/actions/install@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          cache-version: release-gate-docs-1
          # README.Rmd renders with cynkratemplate::readme_document.
          extra-packages: any::devtools cynkra/cynkratemplate

      - name: Check the generated documentation
        uses: BristolMyersSquibb/blockr.ci/.github/actions/release-docs@5ee8e2be16e71e96628c6c5c60c20c03f1b35155

      - name: Hand the job's status to the report
        id: result
        if: always()
        env:
          STATUS: ${{ job.status }}
        run: |
          echo "result=$STATUS" >> "$GITHUB_OUTPUT"
        shell: bash

  soft:
    runs-on: ubuntu-26.04
    timeout-minutes: 120

    name: "Soft checks"

    env:
      # Left off everywhere else, because the recency and frequency checks cannot be disabled with it.
      _R_CHECK_CRAN_INCOMING_: "true"
      _R_CHECK_CRAN_INCOMING_REMOTE_: "true"

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run the repository-specific before-install steps
        uses: ./.github/workflows/custom/before-install
        if: hashFiles('.github/workflows/custom/before-install/action.yml') != ''

      - name: Install R and the package dependencies
        uses: cynkra/cynkratemplate/.github/actions/install@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          cache-version: release-gate-soft-1
          needs: check
          extra-packages: any::rcmdcheck any::urlchecker any::spelling

      - name: Run the repository-specific after-install steps
        uses: ./.github/workflows/custom/after-install
        if: hashFiles('.github/workflows/custom/after-install/action.yml') != ''

      - name: Run the soft checks
        uses: BristolMyersSquibb/blockr.ci/.github/actions/release-soft@5ee8e2be16e71e96628c6c5c60c20c03f1b35155

  urls:
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    name: "URLs"

    # A third-party host can be down for a moment, so this job reports without holding up a release.
    continue-on-error: true

    # With continue-on-error, `needs.urls.result` reads `success` even when the job failed,
    # so the job hands its own status to the report.
    outputs:
      result: ${{ steps.result.outputs.result }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # urlchecker converts README.md and NEWS.md with pandoc to find their URLs.
      - uses: r-lib/actions/setup-pandoc@v2

      # urlchecker reads the source tree only, so the package and its dependencies are not installed.
      # It refuses to read the vignettes without their builder, knitr, and rmarkdown is knitr's engine here.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::urlchecker, any::knitr, any::rmarkdown
          cache-version: release-gate-urls-1

      - name: Check the URLs
        env:
          # Lifts the rate limit on the GitHub URLs.
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          res <- urlchecker::url_check(".", fail = FALSE, progress = FALSE)
          print(res)

          # Text from files and servers goes into a Markdown table:
          # no line breaks or pipes, no HTML, and no backticks inside a code span.
          cell <- function(x) {
            x <- gsub("[\r\n]+", " ", x)
            x <- gsub("&", "&amp;", x, fixed = TRUE)
            x <- gsub("<", "&lt;", x, fixed = TRUE)
            x <- gsub(">", "&gt;", x, fixed = TRUE)
            gsub("|", "\\|", x, fixed = TRUE)
          }
          code <- function(x) {
            x <- gsub("[\r\n]+", " ", x)
            x <- gsub("`", "'", x, fixed = TRUE)
            x <- gsub("|", "\\|", x, fixed = TRUE)
            ifelse(nzchar(x), paste0("`", x, "`"), "")
          }
          rows <- character()
          for (i in seq_len(NROW(res))) {
            cran <- res$CRAN[[i]]
            url <- if (nzchar(cran)) cran else res$URL[[i]]
            status <- if (nzchar(cran)) "Error" else res$Status[[i]]
            message <- if (nzchar(cran)) "CRAN URL not in canonical form" else res$Message[[i]]
            new <- res$New[[i]]
            for (file in res$From[[i]]) {
              lines <- tryCatch(
                which(grepl(url, readLines(file.path(res$root[[i]], file), warn = FALSE), fixed = TRUE)),
                error = function(e) integer()
              )
              where <- if (length(lines)) paste0(file, ":", lines, collapse = ", ") else file
              rows <- c(rows, sprintf(
                "| %s | %s | %s | %s |",
                code(where), code(url), cell(paste(c(status, message)[nzchar(c(status, message))], collapse = ": ")), code(new)
              ))
            }
          }

          md <- c("### URLs", "")
          md <- if (NROW(res) == 0) {
            c(md, ":white_check_mark: All URLs are correct.")
          } else {
            c(
              md,
              sprintf(":x: %d URL(s) to fix: broken, or moved to the replacement shown.", NROW(res)),
              "",
              "| Where | URL | Status | Replacement |",
              "| --- | --- | --- | --- |",
              rows
            )
          }
          summary <- Sys.getenv("GITHUB_STEP_SUMMARY")
          if (nzchar(summary)) write(md, file = summary, append = TRUE)
          if (NROW(res) > 0) quit(status = 1)
        shell: Rscript {0}

      - name: Hand the job's status to the report
        id: result
        if: always()
        env:
          STATUS: ${{ job.status }}
        run: |
          echo "result=$STATUS" >> "$GITHUB_OUTPUT"
        shell: bash

  # Posts the result to the open release pull request, one comment per workflow, updated in place.
  report:
    needs: [gate, docs, soft, urls]
    if: always()

    runs-on: ubuntu-26.04
    timeout-minutes: 5

    name: "Report to the release pull request"

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: .github/actions

      - name: Post or update the comment
        uses: ./.github/actions/release-report
        with:
          key: release-gate
          title: "Release gate"
          results: |
            gate=${{ needs.gate.result }}
            docs=${{ needs.docs.outputs.result || needs.docs.result }} (reports only)
            soft=${{ needs.soft.result }}
            urls=${{ needs.urls.outputs.result || needs.urls.result }} (reports only)
          token: ${{ github.token }}
