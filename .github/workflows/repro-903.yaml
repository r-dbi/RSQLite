# Reproduction only for r-dbi/RSQLite#903:
# link failure on Windows with rtools42 (R 4.2) when configure.win enables the HTTP VFS,
# `libcrypto.a(b_addr.o): undefined reference to 'gai_strerrorW'`.
#
# Red then green in one run: each job builds the unchanged sources (expected LINK-FAIL on R 4.2, OK on release),
# then the sources with .github/repro-903/configure.win.patch applied (the fix, expected OK),
# runs a smoke test, and asserts the verdicts in its last step.
# The patch file is the fix; this workflow and .github/repro-903/ are not.
# Drop these commits before the fix merges.
#
# The earlier single-script smoke test segfaulted (exit 139) in run 46034648463,
# while the staged smoke test of the same builds passes; cause not identified.
#
# No cache by design: a cold build takes a few minutes,
# so the cached-toolchain loop of the reproduction rules is not needed here.

name: repro-903

on:
  push:
    branches:
      - claude/repro-903
    paths:
      - .github/workflows/repro-903.yaml
      - .github/repro-903/**
      - configure.win
      - cleanup.win
      - src/Makevars*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  repro:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: main-r4.2
            r: '4.2'
            rtools: '42'
            source: branch
          - name: main-release
            r: release
            rtools: ''
            source: branch
          - name: cran-3.53.3-r4.2
            r: '4.2'
            rtools: '42'
            source: cran-tarball
          - name: release-3.54.1-r4.2
            r: '4.2'
            rtools: '42'
            source: cran-release-ref

    env:
      MATRIX_NAME: ${{ matrix.name }}
      PATCH: .github/repro-903/configure.win.patch

    steps:
      - uses: actions/checkout@v4

      - name: Checkout claude/cran-release
        if: matrix.source == 'cran-release-ref'
        uses: actions/checkout@v4
        with:
          ref: claude/cran-release
          path: rel

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          rtools-version: ${{ matrix.rtools }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'

      - name: Write helpers
        shell: bash
        run: |
          mkdir -p _repro
          cat > _repro/lib.sh <<'EOF'
          # build <variant> <source>: install into a temporary library, log to _repro/install-<variant>.log
          build() {
            v="$1"; src="$2"
            mkdir -p "_repro/lib-$v"
            set -o pipefail
            R CMD INSTALL --preclean -l "_repro/lib-$v" "$src" 2>&1 | tee "_repro/install-$v.log"
          }

          # report <variant> <outcome> [<forced verdict>]:
          # extract the key lines, write the verdict to log, summary and step output.
          # Only reports: never fails, the assert step decides.
          report() {
            set +e +o pipefail
            v="$1"; outcome="$2"; log="_repro/install-$v.log"
            if [ -n "${3:-}" ]; then
              verdict="$3"
            elif [ ! -f "$log" ]; then
              verdict=NOT-RUN
            elif [ "$outcome" = success ]; then
              verdict=OK
            elif grep -q gai_strerrorW "$log"; then
              verdict=LINK-FAIL
            else
              verdict=OTHER-FAIL
            fi
            echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
            found=$( (grep -m1 -E 'Found libcurl|libcurl not found' "$log" 2>/dev/null || true) )
            undef=$( (grep -E 'gai_strerrorW|undefined reference' "$log" 2>/dev/null || true) | head -n 100)
            link=$( (grep -F -e '-o RSQLite.dll' "$log" 2>/dev/null || true) )

            echo "===== BEGIN $MATRIX_NAME / $v ====="
            echo "verdict: $verdict (step outcome: $outcome)"
            echo "----- libcurl -----"
            echo "${found:-(no libcurl line)}"
            echo "----- undefined references -----"
            echo "${undef:-(none)}"
            echo "----- link command -----"
            echo "${link:-(no link command)}"
            dll=$(find "_repro/lib-$v/RSQLite/libs" -name RSQLite.dll 2>/dev/null | head -n 1)
            if [ -n "$dll" ]; then
              imports=$(Rscript -e 'invisible(system2("sh", c("_repro/dlls.sh", commandArgs(TRUE)[1])))' "$dll" 2>&1 || true)
            else
              imports="(no installed RSQLite.dll)"
            fi
            echo "----- imported DLLs of $dll -----"
            echo "$imports"
            echo "===== END $MATRIX_NAME / $v ====="

            {
              echo "### $MATRIX_NAME / $v: \`$verdict\`"
              echo
              echo "libcurl:"
              echo '```'
              echo "${found:-(no libcurl line)}"
              echo '```'
              echo "Undefined references:"
              echo '```'
              echo "${undef:-(none)}"
              echo '```'
              echo "Link command:"
              echo '```'
              echo "${link:-(no link command)}"
              echo '```'
              echo "Imported DLLs:"
              echo '```'
              echo "$imports"
              echo '```'
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          }

          # smoke <variant>: load the installed build and query an in-memory database, stage by stage.
          # Writes smoke_verdict (OK, CRASH, FAIL) to the step output; returns non-zero unless OK.
          smoke() {
            v="$1"; mk="_repro/smoke-$v"
            set +e
            Rscript _repro/smoke.R "_repro/lib-$v" "$mk" 2>&1 | tee "_repro/smoke-$v.log"
            rc=${PIPESTATUS[0]}
            set -e
            if [ "$rc" -eq 0 ]; then
              verdict=OK
            elif [ "$rc" -ge 128 ] || grep -qi 'segfault' "_repro/smoke-$v.log"; then
              verdict=CRASH
            else
              verdict=FAIL
            fi
            stages=$(ls "$mk" 2>/dev/null | tr '\n' ' ')
            echo "smoke_verdict=$verdict" >> "$GITHUB_OUTPUT"
            echo "===== smoke $MATRIX_NAME / $v: $verdict (exit $rc), stages done: ${stages:-none} ====="
            echo "- smoke $v: \`$verdict\` (exit $rc), stages done: ${stages:-none}" >> "$GITHUB_STEP_SUMMARY"
            [ "$verdict" = OK ]
          }
          EOF

          cat > _repro/dlls.sh <<'EOF'
          # Print the DLLs imported by $1, with the toolchain on R's PATH
          objdump -p "$1" | grep "DLL Name" || echo "(objdump failed: $?)"
          EOF

          cat > _repro/smoke.R <<'EOF'
          args <- commandArgs(TRUE)
          lib <- args[[1]]
          mk <- args[[2]]
          dir.create(mk, showWarnings = FALSE, recursive = TRUE)
          print(sessionInfo())
          stage <- function(name, expr) {
            cat("=== smoke stage", name, "start\n"); flush.console()
            val <- expr
            file.create(file.path(mk, name))
            cat("=== smoke stage", name, "done\n"); flush.console()
            invisible(val)
          }
          stage("a-library", library(RSQLite, lib.loc = lib))
          con <- stage("b-connect", DBI::dbConnect(SQLite(), ":memory:"))
          res <- stage("c-select", DBI::dbGetQuery(con, "SELECT 1 AS x"))
          print(res)
          stopifnot(identical(res$x, 1L))
          stage("d-disconnect", DBI::dbDisconnect(con))
          print(packageVersion("RSQLite", lib.loc = lib))
          EOF

          cat > _repro/diag.sh <<'EOF'
          echo "PATH=$PATH"
          if command -v pkg-config; then
            echo "--- pkg-config --version"; pkg-config --version || echo "(failed: $?)"
            echo "--- pkg-config --cflags libcurl"; pkg-config --cflags libcurl || echo "(failed: $?)"
            echo "--- pkg-config --libs libcurl"; pkg-config --libs libcurl || echo "(failed: $?)"
            echo "--- pkg-config --static --libs libcurl"; pkg-config --static --libs libcurl || echo "(failed: $?)"
          else
            echo "pkg-config not found; searched PATH above"
          fi
          if command -v curl-config; then
            echo "--- curl-config --libs"; curl-config --libs || echo "(failed: $?)"
            echo "--- curl-config --static-libs"; curl-config --static-libs || echo "(failed: $?)"
          else
            echo "curl-config not found; searched PATH above"
          fi
          if command -v gcc; then gcc --version | head -n 1; else echo "gcc not found"; fi
          EOF

          cat > _repro/cran-deps.R <<'EOF'
          # Install the dependencies of the CRAN tarball that the workspace DESCRIPTION does not cover
          d <- read.dcf("_repro/cran/RSQLite/DESCRIPTION")
          fields <- intersect(c("Depends", "Imports", "LinkingTo"), colnames(d))
          deps <- unlist(strsplit(gsub("\\([^)]*\\)", "", d[, fields]), ","))
          deps <- setdiff(trimws(deps), c("", "R", rownames(installed.packages())))
          cat("Missing dependencies of the tarball:", if (length(deps)) deps else "(none)", "\n")
          repos <- getOption("repos")
          if (is.null(repos) || !"CRAN" %in% names(repos) || !nzchar(repos[["CRAN"]]) || repos[["CRAN"]] == "@CRAN@") {
            repos <- c(CRAN = "https://cloud.r-project.org")
          }
          cat("Repositories:", repos, "\n")
          if (length(deps)) install.packages(deps, repos = repos)
          missing <- setdiff(deps, rownames(installed.packages()))
          if (length(missing)) stop("Still missing after install: ", paste(missing, collapse = ", "))
          EOF

      - name: Diagnostics
        shell: bash
        run: |
          echo "===== shell PATH ====="
          bash _repro/diag.sh || true
          echo "===== R's PATH, as R CMD INSTALL sees it ====="
          Rscript -e 'print(Sys.which(c("sh", "make", "gcc", "pkg-config", "curl-config", "patch")))' || true
          Rscript -e 'invisible(system2("sh", "_repro/diag.sh"))' || true
          Rscript -e 'sessionInfo()' || true

      # Sources are exported with LF line endings, as in a CRAN tarball, so that the patch applies.
      - name: Prepare sources
        shell: bash
        run: |
          case "${{ matrix.source }}" in
            branch)
              mkdir -p _repro/src-unchanged
              git -c core.autocrlf=false archive HEAD | tar -x -C _repro/src-unchanged
              echo "SRC=_repro/src-unchanged" >> "$GITHUB_ENV"
              ;;
            cran-release-ref)
              mkdir -p _repro/src-unchanged
              git -C rel -c core.autocrlf=false archive HEAD | tar -x -C _repro/src-unchanged
              echo "SRC=_repro/src-unchanged" >> "$GITHUB_ENV"
              ;;
            cran-tarball)
              tgz=_repro/RSQLite_3.53.3.tar.gz
              curl -fsSL -o "$tgz" https://cloud.r-project.org/src/contrib/RSQLite_3.53.3.tar.gz ||
                curl -fsSL -o "$tgz" https://cloud.r-project.org/src/contrib/Archive/RSQLite/RSQLite_3.53.3.tar.gz
              mkdir -p _repro/cran
              tar -xzf "$tgz" -C _repro/cran
              echo "SRC=$tgz" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Install dependencies of the CRAN tarball
        if: matrix.source == 'cran-tarball'
        shell: bash
        run: Rscript _repro/cran-deps.R

      - name: Build unchanged
        id: unchanged
        continue-on-error: true
        shell: bash
        run: |
          source _repro/lib.sh
          build unchanged "$SRC"

      - name: Report unchanged
        id: report_unchanged
        if: always()
        shell: bash
        run: |
          source _repro/lib.sh
          report unchanged "${{ steps.unchanged.outcome }}" || true

      - name: Smoke test unchanged
        id: smoke_unchanged
        if: always() && steps.unchanged.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          source _repro/lib.sh
          smoke unchanged

      - name: Prepare fixed
        id: prep_fixed
        if: always()
        shell: bash
        run: |
          d=_repro/src-fixed
          mkdir -p "$d"
          if [ "${{ matrix.source }}" = cran-tarball ]; then
            cp -R _repro/cran/RSQLite/. "$d"
          else
            cp -R "$SRC"/. "$d"
          fi
          if ! patch -p1 -d "$d" --dry-run --batch < "$PATCH"; then
            if [ "${{ matrix.source }}" = cran-tarball ]; then
              echo "::warning::fix does not apply to the CRAN 3.53.3 tarball: NOT-APPLICABLE"
              echo "applicable=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::fix $PATCH does not apply"
            exit 1
          fi
          patch -p1 -d "$d" --batch < "$PATCH"
          grep -q "CURL_LIBS_ONELINE=" "$d/configure.win" && ! grep -q "dedup_libs" "$d/configure.win" || {
            echo "::error::patched configure.win lacks the fix"
            exit 1
          }
          sed -n '/^oneline() {/,/^}/p' "$d/configure.win"
          echo "applicable=true" >> "$GITHUB_OUTPUT"

      - name: Build fixed
        id: fixed
        if: always() && steps.prep_fixed.outputs.applicable == 'true'
        continue-on-error: true
        shell: bash
        run: |
          source _repro/lib.sh
          build fixed _repro/src-fixed

      - name: Report fixed
        id: report_fixed
        if: always()
        shell: bash
        run: |
          source _repro/lib.sh
          if [ "${{ steps.prep_fixed.outputs.applicable }}" = false ]; then
            report fixed "${{ steps.fixed.outcome }}" NOT-APPLICABLE || true
          else
            report fixed "${{ steps.fixed.outcome }}" || true
          fi

      - name: Smoke test fixed
        id: smoke_fixed
        if: always() && steps.fixed.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          source _repro/lib.sh
          smoke fixed

      - name: Upload install logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-logs-${{ matrix.name }}
          path: |
            _repro/*.log
            _repro/smoke-*/
          retention-days: 7
          if-no-files-found: warn

      - name: Assert verdicts
        if: always()
        shell: bash
        env:
          UNCHANGED: ${{ steps.report_unchanged.outputs.verdict }}
          FIXED: ${{ steps.report_fixed.outputs.verdict }}
          SMOKE_UNCHANGED: ${{ steps.smoke_unchanged.outputs.smoke_verdict }}
          SMOKE_FIXED: ${{ steps.smoke_fixed.outputs.smoke_verdict }}
          R_VERSION: ${{ matrix.r }}
          SOURCE: ${{ matrix.source }}
        run: |
          ok=true
          if [ "$R_VERSION" = release ]; then
            exp_unchanged=OK; exp_smoke_unchanged=OK
            [ "$SMOKE_UNCHANGED" = OK ] || ok=false
          else
            exp_unchanged=LINK-FAIL; exp_smoke_unchanged="(not checked)"
          fi
          [ "$UNCHANGED" = "$exp_unchanged" ] || ok=false
          if [ "$SOURCE" = cran-tarball ] && [ "$FIXED" = NOT-APPLICABLE ]; then
            exp_fixed="OK or NOT-APPLICABLE"; exp_smoke_fixed="OK (not run if NOT-APPLICABLE)"
          else
            exp_fixed=OK; exp_smoke_fixed=OK
            [ "$FIXED" = OK ] || ok=false
            [ "$SMOKE_FIXED" = OK ] || ok=false
          fi
          if $ok; then result=PASS; else result=MISMATCH; fi
          {
            echo "### $MATRIX_NAME: $result"
            echo
            echo "| Build | Verdict | Expected |"
            echo "|---|---|---|"
            echo "| unchanged | \`${UNCHANGED:-none}\` | \`$exp_unchanged\` |"
            echo "| fixed | \`${FIXED:-none}\` | $exp_fixed |"
            echo "| smoke unchanged | \`${SMOKE_UNCHANGED:-NOT-RUN}\` | $exp_smoke_unchanged |"
            echo "| smoke fixed | \`${SMOKE_FIXED:-NOT-RUN}\` | $exp_smoke_fixed |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          $ok || { echo "::error::verdicts do not match the expectation"; exit 1; }
