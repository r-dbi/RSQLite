name: "Action to install roxygen2 from a fork branch"
description: >
  This action installs roxygen2 with only the `R/` part of a fork branch applied
  on top of upstream, and stamps the result as a `.9100` build so that a
  package's `Config/roxygen2/version` says which roxygen2 documented it.

inputs:
  upstream:
    description: "Repository to install, in owner/repo form"
    required: false
    default: "r-lib/roxygen2"
  upstream-sha:
    description: "Full commit SHA of upstream to install. Bump together with `fork-sha`, in a reviewed commit."
    required: false
    default: "c0ba46156a55a812f28d60fb033e30b2d6b0a311"
  fork:
    description: "Repository holding the branch to apply, in owner/repo form"
    required: false
    default: "krlmlr/roxygen2"
  fork-sha:
    description: "Full commit SHA of the fork branch (f-sentence-spacing) whose `R/` changes are applied. Bump in a reviewed commit."
    required: false
    default: "6b59d36a6e429576ec2d2b162395d60d335f91a0"

runs:
  using: "composite"
  steps:
    - name: Install roxygen2 with the fork's R changes
      env:
        UPSTREAM: ${{ inputs.upstream }}
        UPSTREAM_SHA: ${{ inputs.upstream-sha }}
        FORK: ${{ inputs.fork }}
        FORK_SHA: ${{ inputs.fork-sha }}
      run: |
        ## -- Install roxygen2 from a fork commit --
        set -euo pipefail

        workdir="$(mktemp -d)"
        trap 'rm -rf "$workdir"' EXIT

        # Both sides are pinned to full commit SHAs, so the build is the same on
        # every run and a push to the fork's branch cannot change what this job
        # executes with a write token. Bump the pins in a reviewed commit.
        # The values come in through `env:`, never interpolated into the script.
        for sha in "$UPSTREAM_SHA" "$FORK_SHA"; do
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=roxygen2 fork::'${sha}' is not a full commit SHA."
            exit 1
          fi
        done

        # The network can fail for a moment; try a call up to three times.
        retry() {
          for attempt in 1 2 3; do
            "$@" && return 0
            echo "Attempt ${attempt} failed: $*"
            sleep $((attempt * 5))
          done
          return 1
        }

        git init --quiet "$workdir/pkg"
        cd "$workdir/pkg"

        # Fetch by SHA, with the commit history but without file contents
        # (`--filter=blob:none`), so that `git merge-base` finds the branch
        # point however far apart the two commits are, and no history window
        # can be outgrown. Blobs are fetched on demand by `git diff`.
        retry git fetch --quiet --filter=blob:none "https://github.com/${UPSTREAM}.git" "$UPSTREAM_SHA" || {
          echo "::error title=roxygen2 fork::Could not fetch ${UPSTREAM}@${UPSTREAM_SHA}."
          exit 1
        }
        git checkout --quiet --detach "$UPSTREAM_SHA"
        echo "upstream ${UPSTREAM}@${UPSTREAM_SHA}"

        retry git fetch --quiet --filter=blob:none "https://github.com/${FORK}.git" "$FORK_SHA" || {
          echo "::error title=roxygen2 fork::Could not fetch ${FORK}@${FORK_SHA}."
          exit 1
        }
        echo "fork ${FORK}@${FORK_SHA}"

        # Diff from the branch point, not from the tip's parent: the branch
        # carries several commits and a tip-only diff would apply just the last.
        if ! base="$(git merge-base "$UPSTREAM_SHA" "$FORK_SHA")"; then
          echo "::error title=roxygen2 fork::${FORK}@${FORK_SHA} has no common ancestor with ${UPSTREAM}@${UPSTREAM_SHA}."
          echo "Rebase the fork's branch on upstream and update the pinned SHAs."
          exit 1
        fi

        # Only `R/`. The branch also carries tests, NEWS and a regenerated
        # `man/`, none of which this build runs, and all of which are far more
        # likely to conflict as upstream moves. The R change is deliberately
        # kept small: two hunks in `R/markdown.R`, and everything else in a
        # file of its own that upstream will never create, because a patch that
        # adds a whole file cannot conflict.
        git diff "$base" "$FORK_SHA" -- R/ > "$workdir/R.patch"

        if [ ! -s "$workdir/R.patch" ]; then
          echo "::error title=roxygen2 fork::${FORK}@${FORK_SHA} changes nothing under R/."
          echo "Either the branch has landed upstream and this action should be removed,"
          echo "or the pinned SHA is wrong."
          exit 1
        fi

        # --3way so the patch still applies when the pinned upstream is newer
        # than the branch point. A conflict is a hard stop: installing an
        # unpatched roxygen2 would regenerate every man/ file without the
        # change, and the diff would look like unrelated documentation churn
        # rather than a failed install.
        if ! git apply --3way --verbose "$workdir/R.patch"; then
          echo "::error title=roxygen2 fork::Could not apply ${FORK}@${FORK_SHA} onto ${UPSTREAM}@${UPSTREAM_SHA}."
          echo "This is usually an ordinary merge conflict: upstream has changed the same lines."
          echo "Rebase the fork's branch on upstream and update the pinned SHAs."
          exit 1
        fi

        # Stamp the build. roxygen2 writes its own version into a package's
        # Config/roxygen2/version, so this is what makes it visible that the
        # documentation was generated with the patch: upstream numbers its
        # development builds x.y.z.9000, and this takes the same x.y.z with
        # .9100. Derived from upstream's own version so it follows when the pin
        # moves. Only the `Version:` line is edited; the rest of DESCRIPTION,
        # including the `Authors@R` indentation, is left byte for byte.
        v="$(sed -n 's/^Version:[[:space:]]*//p' DESCRIPTION)"
        stamped="$(printf '%s' "$v" | sed -E 's/^([0-9]+[.][0-9]+[.][0-9]+).*$/\1.9100/')"
        if ! [[ "$stamped" =~ ^[0-9]+[.][0-9]+[.][0-9]+[.]9100$ ]]; then
          echo "::error title=roxygen2 fork::Cannot stamp upstream version '${v}'."
          exit 1
        fi
        sed -i "s/^Version:.*/Version: ${stamped}/" DESCRIPTION
        echo "stamped ${v} -> ${stamped}"

        R CMD INSTALL --no-docs .

        # Fail here rather than three steps later with a puzzling man/ diff.
        Rscript -e '
          v <- as.character(packageVersion("roxygen2"))
          patched <- exists("mdxml_keep_sentence_spacing", envir = asNamespace("roxygen2"), inherits = FALSE)
          cat("roxygen2", v, "patched:", patched, "\n")
          # Assert the whole shape, not just the suffix: a malformed stamp such as
          # "\001.9100" also ends in .9100, which is how the escaping bug in this
          # very expression went unnoticed until CI refused to install the result.
          if (!grepl("^[0-9]+[.][0-9]+[.][0-9]+[.]9100$", v) || !patched) {
            stop("roxygen2 was not installed from the fork branch.", call. = FALSE)
          }
        '
      shell: bash
