on:
  schedule:
    - cron:  '0 8 * * *'
  push:
    branches:
      - master
      - main
    paths:
      - "data-raw/upgrade.R"
      - ".github/workflows/upgrade.yaml"
  workflow_dispatch:

name: upgrade

permissions: {}

jobs:
  upgrade:
    runs-on: ubuntu-26.04
    timeout-minutes: 60 # longest run seen: 16 min

    name: Upgrade bundled SQLite

    permissions:
      contents: write
      pull-requests: write
      actions: write

    steps:
      - name: Check rate limits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api rate_limit
        shell: bash

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure the Git identity
        uses: cynkra/cynkratemplate/.github/actions/git-identity@main

      - name: Install R and the packages that data-raw/upgrade.R uses
        uses: cynkra/cynkratemplate/.github/actions/install@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          packages: any::curl, any::gert, any::magrittr, any::rvest, any::xml2, any::sessioninfo
          extra-packages: ""
          cache-version: upgrade-1

      - name: Session info
        uses: cynkra/cynkratemplate/.github/actions/session-info@main

      - name: Run preparation
        id: vendor
        run: |
          R -q -f data-raw/upgrade.R
          # Check if ahead of upstream branch
          # If yes, set a step output
          if [ "$(git rev-list HEAD...origin/main --count)" -gt 0 ]; then
            # Avoid set-output, it's deprecated
            echo "vendor=ok" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Create PR
        if: steps.vendor.outputs.vendor != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          git checkout -b vendor
          if git push -u origin HEAD; then
            gh pr create --fill-first
            # The branch push above raised no event, so the `rcc` status the
            # pull request is gated on has to be asked for: the smoke test only.
            gh workflow run R-CMD-check.yaml -f ref="$(git rev-parse HEAD)" \
              -f versions-matrix=false \
              -f dep-suggests-matrix=false \
              -f run-rcc-suggests=false
            gh pr merge --auto --squash
          fi
        shell: bash

      - name: Check rate limits
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api rate_limit
        shell: bash
